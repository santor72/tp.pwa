# Isolated test infrastructure only. Never merge this file with compose.yaml.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payment_events_test
      POSTGRES_USER: events_test
      POSTGRES_PASSWORD: events_test
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events_test -d payment_events_test"]
      interval: 1s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1::6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 30
