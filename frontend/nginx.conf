server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # API-container IP can change on `docker compose up --build`. Resolve its
  # Compose service name dynamically instead of retaining a stale address.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream api:8000;

  location /api/ {
    # Reports allow 5 photos of 10 MiB each, plus multipart fields/overhead.
    client_max_body_size 55m;
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health/ {
    proxy_pass http://$api_upstream;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
