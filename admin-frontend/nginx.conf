server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream api:8000;
  location /api/ { proxy_pass http://$api_upstream; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /health/ { return 200 'ok'; add_header Content-Type text/plain; }
  location __ADMIN_BASE_PATH__ { rewrite ^__ADMIN_BASE_PATH__(.*)$ /$1 break; try_files $uri $uri/ /index.html; }
}
