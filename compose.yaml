x-payment-events-environment: &payment-events-environment
  PAYMENT_PROCESSING_MODE: ${PAYMENT_PROCESSING_MODE:-legacy}
  PAYMENT_EVENTS_REDIS_URL: ${PAYMENT_EVENTS_REDIS_URL:-redis://redis:6379/3}
  PAYMENT_EVENTS_PREFIX: ${PAYMENT_EVENTS_PREFIX:-tp-pwa}
  PAYMENT_OUTBOX_POLL_SECONDS: ${PAYMENT_OUTBOX_POLL_SECONDS:-1}
  PAYMENT_RECOVERY_INTERVAL_SECONDS: ${PAYMENT_RECOVERY_INTERVAL_SECONDS:-30}
  PAYMENT_LEASE_SECONDS: ${PAYMENT_LEASE_SECONDS:-90}
  PAYMENT_HEARTBEAT_SECONDS: ${PAYMENT_HEARTBEAT_SECONDS:-15}
  PAYMENT_RECLAIM_IDLE_MS: ${PAYMENT_RECLAIM_IDLE_MS:-90000}
  PAYMENT_SHUTDOWN_GRACE_SECONDS: ${PAYMENT_SHUTDOWN_GRACE_SECONDS:-30}
  PAYMENT_FORMATION_CONCURRENCY: ${PAYMENT_FORMATION_CONCURRENCY:-1}
  PAYMENT_RECONCILIATION_CONCURRENCY: ${PAYMENT_RECONCILIATION_CONCURRENCY:-1}
  PAYMENT_BITRIX_REQUESTS_PER_SECOND: ${PAYMENT_BITRIX_REQUESTS_PER_SECOND:-1}
  PAYMENT_BITRIX_COOLDOWN_SECONDS: ${PAYMENT_BITRIX_COOLDOWN_SECONDS:-30}
  PAYMENT_HEALTH_INTERVAL_SECONDS: ${PAYMENT_HEALTH_INTERVAL_SECONDS:-30}
  PAYMENT_HEALTH_DUE_AGE_SECONDS: ${PAYMENT_HEALTH_DUE_AGE_SECONDS:-120}
  PAYMENT_HEALTH_OUTBOX_AGE_SECONDS: ${PAYMENT_HEALTH_OUTBOX_AGE_SECONDS:-10}
  PAYMENT_STREAM_RETENTION_ENABLED: ${PAYMENT_STREAM_RETENTION_ENABLED:-false}
  PAYMENT_STREAM_RETENTION_DAYS: ${PAYMENT_STREAM_RETENTION_DAYS:-30}
  PAYMENT_STREAM_RETENTION_BATCH_SIZE: ${PAYMENT_STREAM_RETENTION_BATCH_SIZE:-50}
  PAYMENT_STREAM_RETENTION_INTERVAL_SECONDS: ${PAYMENT_STREAM_RETENTION_INTERVAL_SECONDS:-600}
  PAYMENT_JOB_RETENTION_ENABLED: ${PAYMENT_JOB_RETENTION_ENABLED:-false}
  PAYMENT_JOB_RETENTION_DAYS: ${PAYMENT_JOB_RETENTION_DAYS:-30}
  PAYMENT_JOB_RETENTION_BATCH_SIZE: ${PAYMENT_JOB_RETENTION_BATCH_SIZE:-50}
  PAYMENT_JOB_RETENTION_INTERVAL_SECONDS: ${PAYMENT_JOB_RETENTION_INTERVAL_SECONDS:-600}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techportal}
      POSTGRES_USER: ${POSTGRES_USER:-techportal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    logging:
      driver: fluentd
      options:
        fluentd-address: "127.0.0.1:24224"
        fluentd-async: "true"
        tag: "tppwa.redis"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    logging:
      driver: fluentd
      options:
        fluentd-address: "127.0.0.1:24224"
        fluentd-async: "true"
        tag: "tppwa.api"
    environment:
      <<: *payment-events-environment
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://techportal:change-me@postgres:5432/techportal}
      TP_BASE_URL: ${TP_BASE_URL:-https://tp.point.online/api/ext}
      TP_BASE_TOKEN: ${TP_BASE_TOKEN:-}
      TP_AUTH_TIMEOUT_SECONDS: ${TP_AUTH_TIMEOUT_SECONDS:-20}
      TP_API_TIMEOUT_SECONDS: ${TP_API_TIMEOUT_SECONDS:-20}
      TP_TICKETS_MAX_PAGES: ${TP_TICKETS_MAX_PAGES:-100}
      TP_USERS_CACHE_TTL_SECONDS: ${TP_USERS_CACHE_TTL_SECONDS:-300}
      GIS_BASE_URL: ${GIS_BASE_URL:-}
      GIS_API_TOKEN: ${GIS_API_TOKEN:-}
      GIS_MAP_PROVIDER: ${GIS_MAP_PROVIDER:-yandex}
      YANDEX_MAPS_API_KEY: ${YANDEX_MAPS_API_KEY:-}
      GIS_TIMEOUT_SECONDS: ${GIS_TIMEOUT_SECONDS:-20}
      GIS_ICON_CACHE_TTL_SECONDS: ${GIS_ICON_CACHE_TTL_SECONDS:-31536000}
      GIS_VISIBLE_TECHPORTAL_ROLES: ${GIS_VISIBLE_TECHPORTAL_ROLES:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://seaweedfs:8333}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-techportal-reports}
      S3_REGION: ${S3_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: "true"
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_PHOTO_USAGE: ${S3_PHOTO_USAGE:-gis_and_techportal}
      TP_PHOTO_UPLOAD_ENABLED: ${TP_PHOTO_UPLOAD_ENABLED:-false}
      S3_TIMEOUT_SECONDS: ${S3_TIMEOUT_SECONDS:-20}
      SESSION_COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: http://localhost:8081,http://127.0.0.1:8081,http://localhost:8082,http://127.0.0.1:8082
      ESB_BASE_URL: ${ESB_BASE_URL:-}
      ESB_BASE_TOKEN: ${ESB_BASE_TOKEN:-}
      PAYMENT_ADDRESSES_CACHE_TTL_SECONDS: ${PAYMENT_ADDRESSES_CACHE_TTL_SECONDS:-300}
      SESSION_ABSOLUTE_TTL_SECONDS: ${SESSION_TTL_SECONDS:-43200}
      SESSION_IDLE_TTL_SECONDS: ${SESSION_IDLE_TTL_SECONDS:-28800}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      MESSENGER_SHOW: ${MESSENGER_SHOW:-false}
      BX24_WEBHOOK: ${BX24_WEBHOOK:-}
      BX24_PAYMENT_PRODUCTS: ${BX24_PAYMENT_PRODUCTS:-{}}
      BX24_PRICE_GROUP_ID: ${BX24_PRICE_GROUP_ID:-2}
      BX24_NEW_LEAD_STATUS_ID: ${BX24_NEW_LEAD_STATUS_ID:-NEW}
      BX24_PAYMENT_CURRENCY: ${BX24_PAYMENT_CURRENCY:-RUB}
      BX24_PAYMENT_MIN_AMOUNT: ${BX24_PAYMENT_MIN_AMOUNT:-1.00}
      BX24_PAYMENT_MAX_AMOUNT: ${BX24_PAYMENT_MAX_AMOUNT:-1000000.00}
      BX24_PAYMENT_ALLOW_PRICE_OVERRIDE: ${BX24_PAYMENT_ALLOW_PRICE_OVERRIDE:-true}
      BX24_PAYMENT_LINK_FIELD: ${BX24_PAYMENT_LINK_FIELD:-}
      BX24_PAYMENT_SEND_TRIGGER: ${BX24_PAYMENT_SEND_TRIGGER:-}
      BX24_PAYMENT_CREATE_ACTIVITY: ${BX24_PAYMENT_CREATE_ACTIVITY:-false}
      BX24_PAYMENT_WEBHOOK_TOKEN: ${BX24_PAYMENT_WEBHOOK_TOKEN:-}
      BX24_PAYMENT_POLL_INTERVAL_SECONDS: ${BX24_PAYMENT_POLL_INTERVAL_SECONDS:-30}
      BX24_PAYMENT_EXPIRES_SECONDS: ${BX24_PAYMENT_EXPIRES_SECONDS:-86400}
      BX24_PAYMENT_CATALOG_CACHE_TTL_SECONDS: ${BX24_PAYMENT_CATALOG_CACHE_TTL_SECONDS:-300}
      BX24_TIMEOUT_SECONDS: ${BX24_TIMEOUT_SECONDS:-20}
      PAYMENT_TELEMETRY_ENABLED: ${PAYMENT_TELEMETRY_ENABLED:-false}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seaweedfs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - gis-icon-cache:/app/.cache/gis-icons

  seaweedfs-config:
    image: python:3.13-alpine
    command: ["python", "/scripts/render_s3_config.py"]
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - seaweedfs-config:/config
      - ./infrastructure/seaweedfs/render_s3_config.py:/scripts/render_s3_config.py:ro

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    command: ["server", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data"]
    ports:
      - "127.0.0.1:${SEAWEEDFS_S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data
      - seaweedfs-config:/etc/seaweedfs:ro
    depends_on:
      seaweedfs-config:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  seaweedfs-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "/scripts/create_bucket.py"]
    environment:
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://seaweedfs:8333}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-techportal-reports}
      S3_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - ./infrastructure/seaweedfs/create_bucket.py:/scripts/create_bucket.py:ro
    depends_on:
      seaweedfs:
        condition: service_healthy

  completion-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.completion_worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://techportal:change-me@postgres:5432/techportal}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GIS_BASE_URL: ${GIS_BASE_URL:-}
      GIS_API_TOKEN: ${GIS_API_TOKEN:-}
      GIS_TIMEOUT_SECONDS: ${GIS_TIMEOUT_SECONDS:-20}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://seaweedfs:8333}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-techportal-reports}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_PHOTO_USAGE: ${S3_PHOTO_USAGE:-gis_and_techportal}
      S3_TIMEOUT_SECONDS: ${S3_TIMEOUT_SECONDS:-20}
      GIS_COMPLETION_WORKER_POLL_SECONDS: ${GIS_COMPLETION_WORKER_POLL_SECONDS:-5}
      GIS_COMPLETION_WORKER_BATCH_SIZE: ${GIS_COMPLETION_WORKER_BATCH_SIZE:-10}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://techportal:change-me@postgres:5432/techportal}
    depends_on:
      postgres:
        condition: service_healthy

  telegram-bot:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.telegram_bot"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://techportal:change-me@postgres:5432/techportal}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_BOT_DB: ${REDIS_BOT_DB:-2}
      TP_BASE_URL: ${TP_BASE_URL:-https://tp.point.online/api/ext}
      TP_BASE_TOKEN: ${TP_BASE_TOKEN:-}
      TP_API_TIMEOUT_SECONDS: ${TP_API_TIMEOUT_SECONDS:-20}
      TP_TICKETS_MAX_PAGES: ${TP_TICKETS_MAX_PAGES:-100}
      TP_USERS_CACHE_TTL_SECONDS: ${TP_USERS_CACHE_TTL_SECONDS:-300}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TG_ACCESS_GROUPS: ${TG_ACCESS_GROUPS:-}
      TG_ACCESS_CACHE_TTL_SECONDS: ${TG_ACCESS_CACHE_TTL_SECONDS:-300}
      TG_LINK_TOKEN_TTL_SECONDS: ${TG_LINK_TOKEN_TTL_SECONDS:-600}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  payment-worker: &payment-worker-service
    profiles: [legacy]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.payment_worker"]
    environment:
      <<: *payment-events-environment
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://techportal:change-me@postgres:5432/techportal}
      BX24_WEBHOOK: ${BX24_WEBHOOK:-}
      BX24_PAYMENT_PRODUCTS: ${BX24_PAYMENT_PRODUCTS:-{}}
      BX24_PRICE_GROUP_ID: ${BX24_PRICE_GROUP_ID:-2}
      BX24_NEW_LEAD_STATUS_ID: ${BX24_NEW_LEAD_STATUS_ID:-NEW}
      BX24_PAYMENT_CURRENCY: ${BX24_PAYMENT_CURRENCY:-RUB}
      BX24_PAYMENT_MIN_AMOUNT: ${BX24_PAYMENT_MIN_AMOUNT:-1.00}
      BX24_PAYMENT_MAX_AMOUNT: ${BX24_PAYMENT_MAX_AMOUNT:-1000000.00}
      BX24_PAYMENT_ALLOW_PRICE_OVERRIDE: ${BX24_PAYMENT_ALLOW_PRICE_OVERRIDE:-true}
      BX24_PAYMENT_LINK_FIELD: ${BX24_PAYMENT_LINK_FIELD:-}
      BX24_PAYMENT_SEND_TRIGGER: ${BX24_PAYMENT_SEND_TRIGGER:-}
      BX24_PAYMENT_CREATE_ACTIVITY: ${BX24_PAYMENT_CREATE_ACTIVITY:-false}
      BX24_PAYMENT_WEBHOOK_TOKEN: ${BX24_PAYMENT_WEBHOOK_TOKEN:-}
      BX24_PAYMENT_POLL_INTERVAL_SECONDS: ${BX24_PAYMENT_POLL_INTERVAL_SECONDS:-30}
      BX24_PAYMENT_EXPIRES_SECONDS: ${BX24_PAYMENT_EXPIRES_SECONDS:-86400}
      BX24_PAYMENT_CATALOG_CACHE_TTL_SECONDS: ${BX24_PAYMENT_CATALOG_CACHE_TTL_SECONDS:-300}
      BX24_TIMEOUT_SECONDS: ${BX24_TIMEOUT_SECONDS:-20}
      BX24_WORKER_BATCH_SIZE: ${BX24_WORKER_BATCH_SIZE:-10}
      PAYMENT_TELEMETRY_ENABLED: ${PAYMENT_TELEMETRY_ENABLED:-false}
      BX24_WORKER_MAX_RETRIES: ${BX24_WORKER_MAX_RETRIES:-8}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  payment-outbox-relay:
    <<: *payment-worker-service
    profiles: [events]
    command: ["python", "-m", "app.payment_runtime", "relay"]
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "python", "-m", "app.payment_runtime", "health", "relay"]
      interval: 15s
      timeout: 5s
      retries: 3

  payment-formation-worker:
    <<: *payment-worker-service
    profiles: [events]
    command: ["python", "-m", "app.payment_runtime", "formation"]
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "python", "-m", "app.payment_runtime", "health", "formation"]
      interval: 15s
      timeout: 5s
      retries: 3

  payment-reconciliation-worker:
    <<: *payment-worker-service
    profiles: [events]
    command: ["python", "-m", "app.payment_runtime", "reconciliation"]
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "python", "-m", "app.payment_runtime", "health", "reconciliation"]
      interval: 15s
      timeout: 5s
      retries: 3

  payment-recovery-formation:
    <<: *payment-worker-service
    profiles: [events]
    command: ["python", "-m", "app.payment_runtime", "recovery-formation"]
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "python", "-m", "app.payment_runtime", "health", "recovery-formation"]
      interval: 15s
      timeout: 5s
      retries: 3

  payment-recovery-reconciliation:
    <<: *payment-worker-service
    profiles: [events]
    command: ["python", "-m", "app.payment_runtime", "recovery-reconciliation"]
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "python", "-m", "app.payment_runtime", "health", "recovery-reconciliation"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    logging:
      driver: fluentd
      options:
        fluentd-address: "127.0.0.1:24224"
        fluentd-async: "true"
        tag: "tppwa.frontend"
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      api:
        condition: service_healthy

  admin-frontend:
    build:
      context: .
      dockerfile: admin-frontend/Dockerfile
      args:
        ADMIN_BASE_PATH: ${ADMIN_BASE_PATH:-/admin/}
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      ADMIN_BASE_PATH: ${ADMIN_BASE_PATH:-/admin/}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  vector:
    user: "0:0"
    image: timberio/vector:0.44.0-alpine
    command: ["--config", "/etc/vector/vector.toml"]
    ports:
      - "127.0.0.1:24224:24224"
    volumes:
      - ./infrastructure/vector/vector.toml:/etc/vector/vector.toml:ro

volumes:
  gis-icon-cache:
  redis-data:
  postgres-data:
  seaweedfs-data:
  seaweedfs-config:
