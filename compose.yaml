services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techportal}
      POSTGRES_USER: ${POSTGRES_USER:-techportal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    logging:
      driver: fluentd
      options:
        fluentd-address: "127.0.0.1:24224"
        fluentd-async: "true"
        tag: "tppwa.redis"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    logging:
      driver: fluentd
      options:
        fluentd-address: "127.0.0.1:24224"
        fluentd-async: "true"
        tag: "tppwa.api"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://techportal:change-me@postgres:5432/techportal}
      TP_BASE_URL: ${TP_BASE_URL:-https://tp.point.online/api/ext}
      TP_BASE_TOKEN: ${TP_BASE_TOKEN:-}
      TP_AUTH_TIMEOUT_SECONDS: ${TP_AUTH_TIMEOUT_SECONDS:-20}
      TP_API_TIMEOUT_SECONDS: ${TP_API_TIMEOUT_SECONDS:-20}
      TP_TICKETS_MAX_PAGES: ${TP_TICKETS_MAX_PAGES:-100}
      TP_USERS_CACHE_TTL_SECONDS: ${TP_USERS_CACHE_TTL_SECONDS:-300}
      SESSION_COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: http://localhost:8081,http://127.0.0.1:8081
      ESB_BASE_URL: ${ESB_BASE_URL:-}
      ESB_BASE_TOKEN: ${ESB_BASE_TOKEN:-}
      PAYMENT_ADDRESSES_CACHE_TTL_SECONDS: ${PAYMENT_ADDRESSES_CACHE_TTL_SECONDS:-300}
      SESSION_ABSOLUTE_TTL_SECONDS: ${SESSION_TTL_SECONDS:-43200}
      SESSION_IDLE_TTL_SECONDS: ${SESSION_IDLE_TTL_SECONDS:-28800}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      MESSENGER_SHOW: ${MESSENGER_SHOW:-false}
      BX24_WEBHOOK: ${BX24_WEBHOOK:-}
      BX24_PAYMENT_PRODUCTS: ${BX24_PAYMENT_PRODUCTS:-{}}
      BX24_PRICE_GROUP_ID: ${BX24_PRICE_GROUP_ID:-2}
      BX24_NEW_LEAD_STATUS_ID: ${BX24_NEW_LEAD_STATUS_ID:-NEW}
      BX24_PAYMENT_CURRENCY: ${BX24_PAYMENT_CURRENCY:-RUB}
      BX24_PAYMENT_MIN_AMOUNT: ${BX24_PAYMENT_MIN_AMOUNT:-1.00}
      BX24_PAYMENT_MAX_AMOUNT: ${BX24_PAYMENT_MAX_AMOUNT:-1000000.00}
      BX24_PAYMENT_ALLOW_PRICE_OVERRIDE: ${BX24_PAYMENT_ALLOW_PRICE_OVERRIDE:-true}
      BX24_PAYMENT_LINK_FIELD: ${BX24_PAYMENT_LINK_FIELD:-}
      BX24_PAYMENT_SEND_TRIGGER: ${BX24_PAYMENT_SEND_TRIGGER:-}
      BX24_PAYMENT_WEBHOOK_TOKEN: ${BX24_PAYMENT_WEBHOOK_TOKEN:-}
      BX24_PAYMENT_POLL_INTERVAL_SECONDS: ${BX24_PAYMENT_POLL_INTERVAL_SECONDS:-30}
      BX24_PAYMENT_EXPIRES_SECONDS: ${BX24_PAYMENT_EXPIRES_SECONDS:-86400}
      BX24_PAYMENT_CATALOG_CACHE_TTL_SECONDS: ${BX24_PAYMENT_CATALOG_CACHE_TTL_SECONDS:-300}
      BX24_TIMEOUT_SECONDS: ${BX24_TIMEOUT_SECONDS:-20}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://techportal:change-me@postgres:5432/techportal}
    depends_on:
      postgres:
        condition: service_healthy

  telegram-bot:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.telegram_bot"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://techportal:change-me@postgres:5432/techportal}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_BOT_DB: ${REDIS_BOT_DB:-2}
      TP_BASE_URL: ${TP_BASE_URL:-https://tp.point.online/api/ext}
      TP_BASE_TOKEN: ${TP_BASE_TOKEN:-}
      TP_API_TIMEOUT_SECONDS: ${TP_API_TIMEOUT_SECONDS:-20}
      TP_TICKETS_MAX_PAGES: ${TP_TICKETS_MAX_PAGES:-100}
      TP_USERS_CACHE_TTL_SECONDS: ${TP_USERS_CACHE_TTL_SECONDS:-300}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TG_ACCESS_GROUPS: ${TG_ACCESS_GROUPS:-}
      TG_ACCESS_CACHE_TTL_SECONDS: ${TG_ACCESS_CACHE_TTL_SECONDS:-300}
      TG_LINK_TOKEN_TTL_SECONDS: ${TG_LINK_TOKEN_TTL_SECONDS:-600}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  payment-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.payment_worker"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://techportal:change-me@postgres:5432/techportal}
      BX24_WEBHOOK: ${BX24_WEBHOOK:-}
      BX24_PAYMENT_PRODUCTS: ${BX24_PAYMENT_PRODUCTS:-{}}
      BX24_PRICE_GROUP_ID: ${BX24_PRICE_GROUP_ID:-2}
      BX24_NEW_LEAD_STATUS_ID: ${BX24_NEW_LEAD_STATUS_ID:-NEW}
      BX24_PAYMENT_CURRENCY: ${BX24_PAYMENT_CURRENCY:-RUB}
      BX24_PAYMENT_MIN_AMOUNT: ${BX24_PAYMENT_MIN_AMOUNT:-1.00}
      BX24_PAYMENT_MAX_AMOUNT: ${BX24_PAYMENT_MAX_AMOUNT:-1000000.00}
      BX24_PAYMENT_ALLOW_PRICE_OVERRIDE: ${BX24_PAYMENT_ALLOW_PRICE_OVERRIDE:-true}
      BX24_PAYMENT_LINK_FIELD: ${BX24_PAYMENT_LINK_FIELD:-}
      BX24_PAYMENT_SEND_TRIGGER: ${BX24_PAYMENT_SEND_TRIGGER:-}
      BX24_PAYMENT_WEBHOOK_TOKEN: ${BX24_PAYMENT_WEBHOOK_TOKEN:-}
      BX24_PAYMENT_POLL_INTERVAL_SECONDS: ${BX24_PAYMENT_POLL_INTERVAL_SECONDS:-30}
      BX24_PAYMENT_EXPIRES_SECONDS: ${BX24_PAYMENT_EXPIRES_SECONDS:-86400}
      BX24_PAYMENT_CATALOG_CACHE_TTL_SECONDS: ${BX24_PAYMENT_CATALOG_CACHE_TTL_SECONDS:-300}
      BX24_TIMEOUT_SECONDS: ${BX24_TIMEOUT_SECONDS:-20}
      BX24_WORKER_BATCH_SIZE: ${BX24_WORKER_BATCH_SIZE:-10}
      BX24_WORKER_MAX_RETRIES: ${BX24_WORKER_MAX_RETRIES:-8}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    logging:
      driver: fluentd
      options:
        fluentd-address: "127.0.0.1:24224"
        fluentd-async: "true"
        tag: "tppwa.frontend"
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      api:
        condition: service_healthy

  vector:
    user: "0:0"
    image: timberio/vector:0.44.0-alpine
    command: ["--config", "/etc/vector/vector.toml"]
    ports:
      - "127.0.0.1:24224:24224"
    volumes:
      - ./infrastructure/vector/vector.toml:/etc/vector/vector.toml:ro

volumes:
  redis-data:
  postgres-data:
